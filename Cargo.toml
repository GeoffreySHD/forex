[workspace]
members = ["packages/*", "contracts/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
csm-std = { path = "packages/csm-std" }
csm-vault = { path = "contracts/csm-vault" }
cosmwasm-std = { version = "2.1", features = ["stargate"] }
cosmwasm-schema = "2.1"
cw20 = "2.0"
cw20-base = { version = "2.0", features = ["library"] }
cw-multi-test = "2.2"
cw-storage-plus = { version = "2", features = ["iterator"] }
cw2 = "2"
thiserror = "2"
schemars = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
rpath = false
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
